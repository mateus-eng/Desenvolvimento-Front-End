<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>

        <section aria-labelledby="titulo-filtros">
            <h2 id="titulo-filtros">Busca e filtros</h2>

            <form id="form-filtros">

                <div>
                    <label for="busca">Buscar tarefa por título:</label>
                    <input type="search" id="busca" name="busca">
                </div>

                <fieldset>
                    <legend>Filtrar por status</legend>

                    <div>
                        <input type="radio" id="status-todos" name="status" value="todos" checked>
                        <label for="status-todos">Todos</label>
                    </div>

                    <div>
                        <input type="radio" id="status-fazer" name="status" value="fazer">
                        <label for="status-fazer">A fazer</label>
                    </div>

                    <div>
                        <input type="radio" id="status-andamento" name="status" value="andamento">
                        <label for="status-andamento">Em andamento</label>
                    </div>

                    <div>
                        <input type="radio" id="status-revisao" name="status" value="revisao">
                        <label for="status-revisao">Em revisão</label>
                    </div>

                    <div>
                        <input type="radio" id="status-concluida" name="status" value="concluida">
                        <label for="status-concluida">Concluída</label>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Filtrar por prioridade</legend>

                    <div>
                        <input type="radio" id="prioridade-todas" name="prioridade" value="todas" checked>
                        <label for="prioridade-todas">Todas</label>
                    </div>

                    <div>
                        <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
                        <label for="prioridade-baixa">Baixa</label>
                    </div>

                    <div>
                        <input type="radio" id="prioridade-media" name="prioridade" value="media">
                        <label for="prioridade-media">Média</label>
                    </div>

                    <div>
                        <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
                        <label for="prioridade-alta">Alta</label>
                    </div>

                </fieldset>

                <div>
                    <label for="ordenacao">Ordenar por prazo:</label>

                    <select id="ordenacao" name="ordenacao">
                        <option value="nenhuma">Sem ordenação</option>
                        <option value="crescente">Prazo mais próximo</option>
                        <option value="decrescente">Prazo mais distante</option>
                    </select>
                </div>

                <button type="submit">Aplicar filtros</button>

                <button type="button" id="limpar-filtros">
                    Limpar filtros
                </button>

            </form>
        </section>

        <section aria-labelledby="titulo-quadro">

            <h2 id="titulo-quadro">Quadro de tarefas</h2>

            <div id="status" role="status" aria-live="polite"></div>

            <div id="tarefas-container"></div>

        </section>

    </main>

    <footer>
        <p>Mateus Santana Machado</p>
        <p>Disciplina: Desenvolvimento Frontend — 2026.2</p>
    </footer>

    <script type="module" src="js/app.js"></script>

</body>

</html>
